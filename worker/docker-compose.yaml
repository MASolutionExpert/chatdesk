services:
  worker:
    # Use the pre-built image from Docker Hub (recommended):
    image: ${CHATDESK_WORKER_IMAGE:-masolutionexpert/chatdesk-worker:latest}
    # Or build locally from source (uncomment and remove the image line above):
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: chatdesk-media-worker
    restart: unless-stopped
    # The worker's HTTP API (transcode/mirror dispatch + webhook callbacks) has
    # NO authentication when WEBHOOK_SECRET is empty, so it must not be reachable
    # from other machines by default. Bind to 127.0.0.1 (the ChatDesk server on
    # the same host reaches it via localhost); set WORKER_BIND=0.0.0.0 ONLY when
    # the worker runs on a dedicated host and is fronted by TLS/reverse proxy.
    ports:
      - "${WORKER_BIND:-127.0.0.1}:${WORKER_PORT:-8080}:${WORKER_PORT:-8080}"
    environment:
      APP_ENV: ${APP_ENV:-production}
      WORKER_PORT: ${WORKER_PORT:-8080}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      # REQUIRED: with an empty secret the worker's checkSecret fails OPEN and
      # anyone who can reach the port can queue transcode/mirror jobs with an
      # arbitrary callbackUrl (SSRF). Must match the ChatDesk server's value.
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET is required (use the same value as the ChatDesk server)}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:-}
      DATA_DIR: ${DATA_DIR:-/app/data}
    volumes:
      # Mount local data volume if processing local filesystem storage
      - ${LOCAL_DATA_DIR:-../data}:/app/data

