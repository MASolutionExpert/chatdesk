name: Promote dev to Stable

# DevOps two-space pipeline — the ONLY way code reaches the Stable channel (main).
#
#   Test channel (dev branch):  every dev push produces a prerelease vX.Y.Z-dev.N
#                               installed/updated by the Test install command.
#   Stable channel (main):      frozen until YOU promote an approved dev tag.
#
# Run this workflow from the GitHub "Actions" tab after you have tested and
# approved a dev version (e.g. v1.1.0-dev.6). It merges that tag into main,
# rewrites VERSION / installer header / CHANGELOG to the stable form (X.Y.Z),
# tags vX.Y.Z on main and publishes the stable release. Stable-channel
# installs (installed from main) then receive it through CLI Update.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      dev_tag:
        description: "Dev tag to promote (e.g. v1.1.0-dev.6)"
        required: true
        type: string

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input
        # dev_tag is passed via env (never interpolated into the script) so a
        # crafted input cannot inject shell commands into the runner.
        env:
          TAG_INPUT: ${{ inputs.dev_tag }}
        run: |
          TAG="$TAG_INPUT"
          # Single-digit version law: minor, patch and the dev counter are one
          # digit each (see scripts/next-dev-version.sh). Overflow carries
          # into the next component (1.2.0-dev.9 -> 1.3.0-dev.1,
          # 1.9.0-dev.9 -> 2.0.0-dev.1).
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]\.[0-9]-dev\.[1-9]$ ]]; then
            echo "::error::dev_tag must look like v1.1.0-dev.6 (got: $TAG)"
            exit 1
          fi
          echo "DEV_TAG=$TAG" >> "$GITHUB_ENV"
          STABLE_VERSION="${TAG#v}"
          STABLE_VERSION="${STABLE_VERSION%-dev.*}"
          echo "STABLE_VERSION=$STABLE_VERSION" >> "$GITHUB_ENV"
          echo "STABLE_TAG=v$STABLE_VERSION" >> "$GITHUB_ENV"
          echo "Promoting $TAG -> stable v$STABLE_VERSION"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          # A PAT is required so pushed tags are attributed to a real user
          # (same reason release.yml uses RELEASE_TOKEN).
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Verify dev tag exists and is not already promoted
        run: |
          git fetch origin dev --tags --prune
          if ! git rev-parse -q --verify "$DEV_TAG^{commit}" >/dev/null; then
            echo "::error::Tag $DEV_TAG does not exist on the remote."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$STABLE_TAG" >/dev/null; then
            # A second promotion inside one dev series (e.g. dev.3 was already
            # promoted as 1.2.1 and now dev.9 lands on the same base). Bump the
            # stable base with the single-digit carry law until a free tag is
            # found (1.2.1 -> 1.2.2, 1.2.9 -> 1.3.0, 1.9.9 -> 2.0.0).
            echo "Stable tag $STABLE_TAG already exists — bumping the base per the carry law."
            IFS='.' read -r MJ MN PT <<< "$STABLE_VERSION"
            while git rev-parse -q --verify "refs/tags/v$STABLE_VERSION" >/dev/null; do
              PT=$((PT + 1))
              if [ "$PT" -ge 10 ]; then PT=0; MN=$((MN + 1)); fi
              if [ "$MN" -ge 10 ]; then MN=0; MJ=$((MJ + 1)); fi
              STABLE_VERSION="$MJ.$MN.$PT"
              STABLE_TAG="v$STABLE_VERSION"
            done
            echo "Promoting $DEV_TAG -> stable v$STABLE_VERSION (bumped)"
          fi
          echo "STABLE_VERSION=$STABLE_VERSION" >> "$GITHUB_ENV"
          echo "STABLE_TAG=$STABLE_TAG" >> "$GITHUB_ENV"

      - name: Merge dev tag into main
        run: |
          git config user.name "chatdesk-release-bot"
          git config user.email "noreply@github.com"
          # main is frozen between promotions, so any conflict can only be in
          # files dev owns (VERSION/CHANGELOG/installer header) — prefer dev,
          # then the next step rewrites them to the stable form anyway.
          git merge --no-ff -X theirs "$DEV_TAG" -m "Promote $DEV_TAG to stable $STABLE_VERSION"

      - name: Rewrite VERSION, installer header and CHANGELOG to stable form
        run: |
          node <<'EOF'
          const fs = require("fs");
          const stable = process.env.STABLE_VERSION;
          const devTag = process.env.DEV_TAG;
          const devVersion = devTag.replace(/^v/, "");

          fs.writeFileSync("VERSION", stable + "\n");

          let install = fs.readFileSync("scripts/install.sh", "utf8");
          install = install.replace(
            /^# chatdesk-deploy-version:.*$/m,
            `# chatdesk-deploy-version: ${stable}`
          );
          fs.writeFileSync("scripts/install.sh", install);

          let changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          // Rename the promoted dev section heading to the stable version
          changelog = changelog.replace(
            new RegExp(`^## ${devVersion.replace(/\./g, "\\.")}\\s*$`, "m"),
            `## ${stable}`
          );
          fs.writeFileSync("CHANGELOG.md", changelog);
          console.log(`Stable form written: ${stable}`);
          EOF

      - name: Verify release-sync gate passes for the stable tree
        run: bash scripts/verify-release-sync.sh

      - name: Commit, tag and push stable release
        run: |
          git add VERSION scripts/install.sh CHANGELOG.md
          git commit -m "Release $STABLE_TAG (promoted from $DEV_TAG)"
          git tag "$STABLE_TAG"
          git push origin main
          git push origin "$STABLE_TAG"

      - name: Extract release notes from CHANGELOG
        run: |
          node <<'EOF' > notes.md
          const fs = require("fs");
          const stable = process.env.STABLE_VERSION;
          const text = fs.readFileSync("CHANGELOG.md", "utf8");
          const heading = new RegExp(`^## ${stable.replace(/\./g, "\\.")}\\s*$`, "m");
          const start = text.search(heading);
          if (start === -1) {
            console.log(`ChatDesk ${stable} — stable release.`);
          } else {
            const next = text.slice(start + 1).search(/^## /m);
            const section = next === -1
              ? text.slice(start)
              : text.slice(start, start + 1 + next);
            console.log(section.replace(/^## .*$/m, `ChatDesk ${stable} — Stable Release`).trim());
          }
          EOF

      - name: Create stable GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release create "$STABLE_TAG" \
            --target main \
            --title "ChatDesk $STABLE_VERSION — Stable Release" \
            --notes-file notes.md
