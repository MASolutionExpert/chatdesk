server {
  listen 443 ssl;
  server_name localhost;
  # Keep this in sync with FILE_UPLOAD_MAX_TOTAL_SIZE_MB in admin settings.
  client_max_body_size 75m;

  ssl_certificate /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;

  # The server runs with `app.set('trust proxy', 1)`; without X-Forwarded-For
  # every request's req.ip is the nginx container IP and all express-rate-limit
  # buckets collapse into one shared per-IP bucket (one abuser throttles
  # everyone). Never add HSTS on the plain-HTTP server block below.
  add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

  location /api/events {
    proxy_pass http://chatdesk:5174;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_buffering off;
    proxy_cache off;
    # nginx add_header directives do NOT inherit into a location that defines
    # its own, so HSTS must be repeated here for the SSE responses.
    add_header X-Accel-Buffering no;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
  }

  location / {
    proxy_pass http://chatdesk:5174;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  return 301 https://$host$request_uri;
}
